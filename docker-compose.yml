# Self-hosting: put NSHMAIL_MASTER_KEY (openssl rand -base64 32) and other settings in .env, then `docker compose up -d`.
services:
  server:
    image: ghcr.io/markbang/nsh-mail-server:latest
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NSHMAIL_MASTER_KEY: ${NSHMAIL_MASTER_KEY:?set NSHMAIL_MASTER_KEY in .env (openssl rand -base64 32)}
    volumes:
      - data:/data

volumes:
  data:
