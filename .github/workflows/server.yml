name: server

on:
  push:
    branches: [main]
    paths:
      - crates/server/**
      - crates/mail-core/**
      # the server mounts crates/mcp at /mcp
      - crates/mcp/**
      - Cargo.toml
      - Cargo.lock
      - docker-compose.yml
      - .github/workflows/server.yml
  pull_request:
    paths:
      - crates/server/**
      - crates/mail-core/**
      # the server mounts crates/mcp at /mcp
      - crates/mcp/**
      - Cargo.toml
      - Cargo.lock
      - docker-compose.yml
      - .github/workflows/server.yml

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      greenmail:
        image: greenmail/standalone:2.1.15
        ports:
          - 3993:3993
          - 3465:3465
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p nsh-mail-server --check
      - run: cargo clippy -p nsh-mail-server --all-targets --locked -- -D warnings
      - name: wait for GreenMail
        run: for i in $(seq 60); do (echo > /dev/tcp/127.0.0.1/3993) 2>/dev/null && exit 0; sleep 1; done; exit 1
      - run: cargo test -p nsh-mail-server --locked
      - name: docs/openapi.json is current
        run: |
          cargo run -p nsh-mail-server --locked -- openapi > /tmp/openapi.json
          if ! diff -u docs/openapi.json /tmp/openapi.json; then
            echo "::error file=docs/openapi.json::stale; run cargo run -p nsh-mail-server -- openapi > docs/openapi.json"
            exit 1
          fi

  docker:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/markbang/nsh-mail-server:latest
            ghcr.io/markbang/nsh-mail-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
