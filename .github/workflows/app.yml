name: App

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NSH_VERSION: v0.5.0
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  # Local mode's OAuth clients, baked in at build time (crates/mail-core/src/oauth.rs); unset secrets mean no OAuth sign-in.
  NSHMAIL_GOOGLE_CLIENT_ID: ${{ secrets.NSHMAIL_GOOGLE_CLIENT_ID }}
  NSHMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.NSHMAIL_GOOGLE_CLIENT_SECRET }}
  NSHMAIL_MS_CLIENT_ID: ${{ secrets.NSHMAIL_MS_CLIENT_ID }}

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-24.04
    # Local mode end to end (app/tests/greenmail.rs) and cloud mode (.e2e/run.sh).
    services:
      greenmail:
        image: greenmail/standalone:2.1.15
        ports:
          - 3993:3993
          - 3465:3465
    env:
      GREENMAIL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      # The test runner and `describe` link the crate with the Linux backend (GTK 4, GStreamer); QuickJS' bindgen needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      # Restored everywhere, saved only from main so pull requests do not evict main's caches.
      - &restore-cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: &cache-path |
            ~/.nsh
            ~/AppData/Local/nsh
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: &cache-key ${{ github.job }}-${{ runner.os }}-${{ env.NSH_VERSION }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: ${{ github.job }}-${{ runner.os }}-${{ env.NSH_VERSION }}-
      - &install-nsh
        name: Install nsh
        run: |
          [ -x ~/.nsh/bin/nsh ] || curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
      - run: nsh check
      - name: Wait for GreenMail
        run: for i in $(seq 60); do (echo > /dev/tcp/127.0.0.1/3993) 2>/dev/null && exit 0; sleep 1; done; exit 1
      - run: nsh test
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cloud mode end to end (app, nsh-mail-server, GreenMail)
        run: .e2e/run.sh
      - &save-cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *cache-path
          key: *cache-key

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The release runner also links WebKitGTK for web views.
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwebkitgtk-6.0-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - *restore-cache
      - *install-nsh
      - run: nsh package App.tsx --target linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: app/.nsh/out/*.tar.gz
          if-no-files-found: error
      - *save-cache

  windows:
    # Slow: only for releases (a pushed version tag or a manual run).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # rustc can overflow its default stack on the `windows` crate's bindings.
      RUST_MIN_STACK: "268435456"
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - *restore-cache
      - name: Install nsh
        shell: pwsh
        run: |
          $nsh = "$env:LOCALAPPDATA\nsh\bin"
          if (-not (Test-Path "$nsh\nsh.exe")) { irm https://nsh.dev/install.ps1 | iex }
          "$nsh" >> $env:GITHUB_PATH
      # `nsh package` compiles the installer when Inno Setup 6 is installed.
      - name: Install Inno Setup
        run: compgen -G "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" || choco install innosetup -y --no-progress
      - run: nsh package App.tsx --target windows
      # `nsh package` leaves the exe unsigned: sign it, then remake the zip and the installer around it and sign that.
      - name: Sign the executable and the installer
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) { "Signing skipped: no WINDOWS_CERT_PFX_BASE64 secret, the exe and installer stay unsigned."; exit 0 }
          if (-not $env:WINDOWS_CERT_PASSWORD) { throw "The WINDOWS_CERT_PASSWORD secret is missing: add the PFX's password." }
          $pfx = Join-Path $env:RUNNER_TEMP 'release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            function Sign($file) {
              & $signtool sign /q /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file
              if ($LASTEXITCODE) { throw "signtool could not sign $file" }
              "Signed $file"
            }
            $out = Resolve-Path .nsh\out
            $iss = Get-Item "$out\*.iss"
            $name = $iss.BaseName
            Sign "$out\$name\$name.exe"
            Remove-Item "$out\$name.zip"
            Compress-Archive -Path "$out\$name" -DestinationPath "$out\$name.zip"
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/O$out" $iss.FullName
            if ($LASTEXITCODE) { throw "ISCC could not rebuild the installer" }
            Sign "$out\$name-setup.exe"
          } finally {
            Remove-Item $pfx -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            app/.nsh/out/*.zip
            app/.nsh/out/*-setup.exe
          if-no-files-found: error
      - *save-cache

  android:
    runs-on: ubuntu-24.04
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Release signing for a pushed version tag or a manual run; pull requests and main stay debug-signed.
      ANDROID_KEYSTORE_BASE64: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NSH_KEYSTORE_PASSWORD: ${{ secrets.NSH_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      # The image has the SDK, its build tools, a JDK and NDKs; `nsh` builds the crate's libnsh.so with the newest NDK.
      - name: Install the Android platform
        run: (yes || :) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" > /dev/null
      - *restore-cache
      - *install-nsh
      - name: Release signing key
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing skipped (needs a v* tag or a manual run, and the ANDROID_KEYSTORE_BASE64 secret): debug-signed builds."
            exit 0
          fi
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::The ANDROID_KEY_ALIAS secret is missing: add the key's alias in the keystore."; exit 1; }
          [ -n "$NSH_KEYSTORE_PASSWORD" ] || { echo "::error::The NSH_KEYSTORE_PASSWORD secret is missing: add the keystore's password."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # The AABs carry 32-bit phones' library too (Play delivers each phone only its own); previews stay arm64-v8a.
          echo "NSH_ABIS=arm64-v8a,armeabi-v7a" >> "$GITHUB_ENV"
      # Runs `nsh package --target android`, then readies the Gradle host (android/): nsh.aar with that libnsh.so, and the bundle.
      - run: android/prepare.sh ${ANDROID_KEYSTORE_FILE:+--keystore "$ANDROID_KEYSTORE_FILE" --key-alias "$ANDROID_KEY_ALIAS"}
        working-directory: .
      # The release artifact is the AAB; the APK beside it, for sideloading, stays arm64-v8a.
      - name: App bundle for Google Play
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          nsh package App.tsx --target android --format aab --abi "$NSH_ABIS" --keystore "$ANDROID_KEYSTORE_FILE" --key-alias "$ANDROID_KEY_ALIAS"
          nsh package App.tsx --target android --abi arm64-v8a --keystore "$ANDROID_KEYSTORE_FILE" --key-alias "$ANDROID_KEY_ALIAS"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            app/.nsh/out/*.apk
            app/.nsh/out/*.aab
          if-no-files-found: error
      # Without the secret the host builds with push off.
      - name: Add the Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        working-directory: android
      - name: Build the Gradle host
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            for apk in ../app/.nsh/out/*.apk app/build/outputs/apk/release/*.apk; do
              "$apksigner" verify --print-certs "$apk" | grep 'SHA-256' | sed "s|^|$(basename "$apk"): |"
            done
          else
            ./gradlew --no-daemon assembleDebug
          fi
        working-directory: android
      - name: Remove the signing key
        if: always() && env.ANDROID_KEYSTORE_FILE != ''
        run: rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: android-fcm
          path: |
            android/app/build/outputs/apk/*/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - *save-cache

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The web runtime's C code compiles with clang and llvm-ar.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - *restore-cache
      - *install-nsh
      # `nsh` runs the wasm-bindgen CLI of the version the crate pins on the web runtime.
      - id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: nsh package App.tsx --target web -o "$RUNNER_TEMP/web"
      # `nsh package` ships no extra files: the Web Push service worker goes next to index.html.
      - name: Add the service worker
        run: |
          site="$RUNNER_TEMP/web/nsh-mail"
          cp web/sw.js "$site/sw.js"
          test -f "$site/index.html" && test -f "$site/sw.js"
          ls "$site"/nsh-bindgen.*.js
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: ${{ runner.temp }}/web
          if-no-files-found: error
      - *save-cache

  # The cloud server with this web client at / (what the hosted deployment runs); pushed from main only.
  image:
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ runner.temp }}/web
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          target: web
          build-contexts: site=${{ runner.temp }}/web/nsh-mail
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/markbang/nsh-mail:latest
            ghcr.io/markbang/nsh-mail:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
