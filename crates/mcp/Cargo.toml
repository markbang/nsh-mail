[package]
name = "nsh-notify-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "MCP server for the nsh-mail notification inbox"

[lib]
name = "notify_mcp"
path = "src/lib.rs"

[[bin]]
name = "nsh-notify-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
