[package]
name = "nsh-mail-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Accept GreenMail's self-signed certificate, for end-to-end tests of the app. Debug builds only.
insecure-test-tls = ["mail-core/insecure-test-tls"]

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
futures-util = "0.3"
mail-core = { path = "../mail-core" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-push-native = "0.5"

[dev-dependencies]
# Delivers a message with an attachment to GreenMail (the API sends none).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
mail-core = { path = "../mail-core", features = ["insecure-test-tls"] }
# mail-core before the shared database: writes the old per-user databases the migration test imports.
mail-core-v0 = { package = "mail-core", git = "https://github.com/markbang/nsh-mail", rev = "ec172435302f79013110f70235acaaaea5c9a89a", features = ["insecure-test-tls"] }
tokio-tungstenite = "0.29"
