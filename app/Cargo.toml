[package]
name = "nsh-app-nsh-mail"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
mail-core = { path = "../crates/mail-core", default-features = false }
serde = "1"
serde_json = "1"

# Local mode: the engine (IMAP, SMTP, SQLite, keyring) where there are sockets and files.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mail-core = { path = "../crates/mail-core" }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
mail-core = { path = "../crates/mail-core", features = ["insecure-test-tls"] }
nsh-engine = "0.5.0"
nsh-testing = { version = "0.5.0", features = ["bundle"] }
