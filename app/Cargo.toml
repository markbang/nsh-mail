[package]
name = "nsh-app-nsh-mail"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# The emulator job's demo build (.github/workflows/android-ui.yml).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nshmail_demo)"] }

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
mail-core = { path = "../crates/mail-core", default-features = false }
base64 = "0.23"
futures-channel = "0.3"
futures-core = "0.3"
# The HTML parser and tree nsh-base's TextView uses (same versions): layout tables are
# rewritten before TextView reads the mail (src/layout.rs).
html5ever = "0.27"
log = "0.4"
markup5ever_rcdom = "0.3"
serde = "1"
serde_json = "1"
url = "2"

# Local mode: the engine (IMAP, SMTP, SQLite, keyring) where there are sockets and files.
# Cloud mode keeps its session token in the same secret stores and gets events over
# tokio-tungstenite, the WebSocket client NSH itself links.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { version = "0.3", default-features = false }
mail-core = { path = "../crates/mail-core" }
tokio = { version = "1", features = ["sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Web Push, the sign-in window and files dropped on the page: browser APIs NSH does not wrap.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "BroadcastChannel",
  "DataTransfer",
  "Document",
  "DragEvent",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "Location",
  "MessageEvent",
  "Navigator",
  "Notification",
  "NotificationPermission",
  "PermissionState",
  "PermissionStatus",
  "Permissions",
  "PushManager",
  "PushSubscription",
  "PushSubscriptionOptionsInit",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "Url",
  "Window",
] }

[dev-dependencies]
mail-core = { path = "../crates/mail-core", features = ["insecure-test-tls"] }
nsh-engine = "0.5.0"
nsh-testing = { version = "0.5.0", features = ["bundle"] }
