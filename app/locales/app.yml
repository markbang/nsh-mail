onboarding.title:
  en: All your mail in one inbox
  zh-CN: 所有邮箱，一个收件箱
onboarding.subtitle:
  en: Choose where nsh-mail keeps your mail. You can change it later in Settings.
  zh-CN: 选择 nsh-mail 在哪里保存你的邮件，之后可以在设置里更改。
onboarding.subtitleWeb:
  en: Sign in to your nsh-mail server to read all your accounts in one place.
  zh-CN: 登录你的 nsh-mail 服务器，在一个地方阅读所有邮箱。
onboarding.local:
  en: On this device
  zh-CN: 仅本机
onboarding.localDetail:
  en: Passwords and mail stay here. nsh-mail connects to your mail servers directly.
  zh-CN: 密码和邮件只保存在本机，nsh-mail 直接连接你的邮件服务器。
onboarding.cloud:
  en: Through an nsh-mail server
  zh-CN: 通过 nsh-mail 服务器
onboarding.cloudDetail:
  en: The server syncs your accounts and pushes new mail to every device, also when the app is closed.
  zh-CN: 服务器代为同步账号，并把新邮件推送到每台设备，应用关闭时也能收到。
onboarding.webOnlyCloud:
  en: Browsers can't connect to mail servers, so the web app works through an nsh-mail server, the official one or your own.
  zh-CN: 浏览器无法直接连接邮件服务器，所以网页版需要通过 nsh-mail 服务器使用，可以是官方的，也可以是你自己部署的。
